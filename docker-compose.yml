services:
  p2p-monitor:
    build: .
    container_name: p2p-monitor
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Хост-порт настраивается через P2P_PORT (по умолчанию 3000). Если на VPS
      # порт 3000 уже занят другим проектом — запусти с P2P_PORT=3100 (или любым
      # свободным):  P2P_PORT=3100 docker compose up -d --build
      # Внутри контейнера порт берётся из PORT из .env (по умолчанию 3000).
      # Боту входящие соединения вообще не нужны — маппинг нужен только для
      # health-check. Если порт не нужен, эту секцию можно удалить целиком.
      - "${P2P_PORT:-3000}:${PORT:-3000}"
